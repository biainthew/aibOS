name: Notion to GitHub Pages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: '전체 동기화(--full) 강제 실행 (일요일 로직을 수동으로 실행)'
        type: boolean
        default: false
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Sync Notion to Markdown
        # push 이벤트(코드/CSS/수동 .md 수정)일 때는 Notion 동기화를 건너뛰고 빌드/배포만 수행
        if: github.event_name != 'push'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          # 수동 실행에서 full_sync 를 켰거나 오늘이 일요일(7)이면 전체 동기화, 아니면 부분 동기화
          if [ "${{ github.event.inputs.full_sync }}" = "true" ] || [ $(date +%u) -eq 7 ]; then
            echo "전체 동기화 실행 (--full)"
            node scripts/notion-sync.js --full
          else
            echo "부분 동기화 실행 (최근 24시간 변경분)"
            node scripts/notion-sync.js
          fi

      - name: Generate related posts
        if: github.event_name != 'push'
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: node scripts/generate-related.js

      - name: Commit and push changes
        if: github.event_name != 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Update blog posts and site data from Notion"
            git push origin master
          else
            echo "No changes found to commit. Skipping push."
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: sync-and-build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4